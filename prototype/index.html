<style>
/* Layout: centered 390px phone frame on wide screens, full-bleed on phones. Scrolling content area + fixed bottom tab bar. Manrope backs both faces for Cyrillic. */
:root{
  --bg:#E8EEF0; --surface:#FFFFFF; --ink:#0E2A33; --muted:#5C7580; --line:#D5E0E4;
  --accent:#0A7B74; --accent-ink:#FFFFFF; --soft:#DDF1EE; --warn:#C2410C; --warn-soft:#FDE9DD; --ok:#15803D; --red:#D92D20;
  --font-display:"Bricolage Grotesque","Manrope","DM Sans",system-ui,sans-serif;
  --font-body:"DM Sans","Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A171C; --surface:#12262D; --ink:#E6F0F2; --muted:#8FA8B1; --line:#1F3A43;
  --accent:#3CC4B9; --accent-ink:#06211F; --soft:#14403F; --warn:#FB923C; --warn-soft:#3B2214; --ok:#4ADE80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A171C; --surface:#12262D; --ink:#E6F0F2; --muted:#8FA8B1; --line:#1F3A43;
  --accent:#3CC4B9; --accent-ink:#06211F; --soft:#14403F; --warn:#FB923C; --warn-soft:#3B2214; --ok:#4ADE80; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
#stage{height:100%;display:flex;align-items:center;justify-content:center;padding-inline:0}
#app{position:relative;width:100%;max-width:420px;height:100%;max-height:860px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){#stage{padding:16px}#app{border-radius:36px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(14,42,51,.18);height:min(840px,100%)}}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .label{color:inherit;opacity:.8}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.tip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-family:var(--font-display);flex:none}
.ico.emo{font-size:20px;line-height:1;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.ico.avatar{font-size:18px}
.avatar.lg{width:72px;height:72px;font-size:28px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--warn)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--ink)}.pos{color:var(--ok)}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);cursor:pointer;border-radius:12px;min-height:52px;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:44px;width:100%}
.auth{padding:24px 20px 32px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;flex:1}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--accent)}
.sheet-bg{position:absolute;inset:0;background:rgba(5,15,18,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto}
.tip{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer}
.tip:hover{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin-block:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{aspect-ratio:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;cursor:pointer;text-align:center;font-size:12px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .emo{font-size:26px;line-height:1;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icobtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;font-size:22px;line-height:1}
.icobtn.sm{width:36px;height:36px;border-radius:12px;font-size:20px}
.icobtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icobtn:focus-visible,.switch:focus-visible,.linkrow:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.linkrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 0 0;cursor:pointer;text-align:left;font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;font:inherit;font-weight:700}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.check-row input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.langtable{width:100%;border-collapse:collapse}
.langtable td{padding:0;border-top:1px solid var(--line)}
.langtable tr:first-child td{border-top:0}
.langbtn{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 0;cursor:pointer;text-align:left;min-height:52px}
.langbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.code{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent);background:var(--soft);border-radius:8px;padding:4px 8px;width:36px;text-align:center;flex:none}
.check{color:var(--accent);font-weight:800;font-size:18px}
.switch{width:56px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:grid;place-items:center;font-size:15px;line-height:1;font-style:normal;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{left:27px}
.btn.logout{background:var(--red);color:#fff;width:100%}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-top:4px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:500}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.preview{width:96px;height:96px;border-radius:50%;object-fit:cover;align-self:center}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}.switch i{transition:left .2s ease}}
</style>

function loanOut(){
  var p=S.loan,a=+p.amt||0,n=Math.round((+p.yrs||0)*12),r=(+p.rate||0)/100/12;
  if(a<=0||n<=0)return '<div class="muted">'+T("lEmpty")+'</div>';
  var pmt=r===0?a/n:a*r/(1-Math.pow(1+r,-n));
  if(!isFinite(pmt))return '<div class="muted">'+T("lEmpty")+'</div>';
  var total=pmt*n,interest=total-a,fee=a*(+p.fee||0)/100;
  return '<div class="hero"><div class="label">'+T("lMonthly")+'</div><div class="big">'+money(pmt)+'</div></div>'+
    '<div class="card"><div class="row"><div class="grow">'+T("lInterest")+'</div><div class="amt">'+money(interest)+'</div></div><div class="row"><div class="grow">'+T("lFeeAmt")+'</div><div class="amt">'+money(fee)+'</div></div><div class="row"><div class="grow" style="font-weight:700">'+T("lTotal")+'</div><div class="amt">'+money(total+fee)+'</div></div></div>'+
    '<div class="note">'+T("lNote")+'</div>';

  var tabs=[["home","tabHome"],["budget","tabBudget"],["savings","tabSavings"],["services","tabServices"]];
  var noTab=(S.screen==="settings"||S.screen==="profile");
  app.innerHTML='<div class="scroll" id="scroll">'+body+foot()+'</div>'+
    '<nav class="tabbar" aria-label="Main">'+tabs.map(function(t){return '<button class="tab" data-a="tab" data-id="'+t[0]+'" aria-current="'+(!noTab&&S.tab===t[0])+'">'+ICON[t[0]]+'<span>'+T(t[1])+'</span></button>'}).join("")+'</nav>'+sheetView();
  var ns=el("scroll");if(ns&&keep)ns.scrollTop=keep;
}

/* ---------- events ---------- */
function finishLogin(){S.mode="app";S.tab="home";S.screen=null;S.pending=null;S.draft={country:"BG"};S.reset=true;render()}
document.addEventListener("submit",function(e){
  var id=e.target.id;
  if(id==="verifyform"){
    e.preventDefault();
    if(el("v-code").value.trim()!==DEMO_CODE){el("verr").textContent=T("errCode");return}
    if(S.pending&&S.pending.kind==="register"){S.user=S.pending.user;saveUser()}
    finishLogin();return;
  }
  if(id!=="authform")return;
  e.preventDefault();
  captureForm();
  var d=S.draft,er=el("autherr"),em=(d.email||"").trim(),pw=d.pw||"";
  if(S.mode==="register"){
    var nm=(d.name||"").trim(),ph=(d.phone||"").trim();
    if(!nm){er.textContent=T("errName");return}
    if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent=T("errEmail");return}
    if(!/^\+?[\d\s()-]{7,20}$/.test(ph)||ph.replace(/\D/g,"").length<7){er.textContent=T("errPhone");return}
    if(pw.length<6){er.textContent=T("errPw");return}
    if(!d.tos){er.textContent=T("errTos");return}
    S.pending={kind:"register",user:{name:nm,email:em,phone:ph,country:d.country||"BG"}};
  }else{
    if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent=T("errEmail");return}
    if(pw.length<6){er.textContent=T("errPw");return}
    if(!S.user||S.user.email!==em){er.textContent=T("errNoAcc");return}
    if(!S.user.country)S.user.country="BG";
    S.pending={kind:"login"};
  }
  S.mode="verify";render();
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="m-range"){el("m-amt").value=t.value;return}
  if(t.id==="m-amt"){var r=el("m-range");if(r)r.value=t.value;return}
  var c=t.getAttribute&&t.getAttribute("data-calc");if(!c)return;
  var k=t.getAttribute("data-k");
  if(c==="loan")S.loan[k]=t.value===""?0:parseFloat(t.value);else S.sal[k]=t.value;
  var out=el("calcout");if(out)out.innerHTML=c==="loan"?loanOut():salOut();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="c-file"&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var c=document.createElement("canvas"),sz=160;c.width=sz;c.height=sz;
        var side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;
        c.getContext("2d").drawImage(img,sx,sy,side,side,0,0,sz,sz);
        var url=c.toDataURL("image/jpeg",0.8);
        if(S.sheet&&S.sheet.type==="change"){S.sheet.val=url;var p=el("c-prev");if(p){p.src=url;p.hidden=false}}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(t.files[0]);
  }
});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
  if(a==="close"&&e.target.closest(".sheet")&&!e.target.closest("button"))return;
  if(S.mode!=="app")captureForm();
  if(["tab","screen","back","toset","settings","logout","authsettings","authback","switch","vback"].indexOf(a)>-1)S.reset=true;
  function err(m){var b=el("sheeterr");if(b)b.textContent=T(m)}
  if(a==="switch"){S.mode=S.mode==="register"?"login":"register"}
  else if(a==="vback"){S.mode=S.pending&&S.pending.kind==="register"?"register":"login";S.pending=null}
  else if(a==="authsettings"){S.screen="authsettings"}
  else if(a==="authback"){S.screen=null}
  else if(a==="tab"){S.tab=id;S.screen=null}
  else if(a==="settings"){S.screen="settings"}
  else if(a==="back"){S.screen=null}
  else if(a==="backsvc"){S.screen=null}
  else if(a==="toset"){S.screen="settings"}
  else if(a==="screen"){S.screen=id}
  else if(a==="feedback"){S.sheet={type:"feedback"}}
  else if(a==="ltype"){var pr=PRESETS[id];S.loan={type:id,amt:pr.amt,yrs:pr.yrs,rate:pr.rate,fee:S.loan.fee}}
  else if(a==="theme"){setTheme(!isDark())}
  else if(a==="langsheet"){S.sheet={type:"lang"}}
  else if(a==="lang"){setLang(id);S.sheet=null}
  else if(a==="doc"){S.sheet={type:"doc",id:id}}
  else if(a==="bank"){S.banks.forEach(function(b){if(b.id===id)b.on=!b.on})}
  else if(a==="addbank"){S.sheet={type:"addbank"}}
  else if(a==="bankadd"){
    var bn=el("b-name").value.trim(),ib=el("b-iban").value.replace(/\s/g,"").toUpperCase();
    if(!bn||!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(ib)){err("errBank");return}
    S.banks.push({id:"b"+Date.now(),name:bn,bal:1250,on:true,last4:ib.slice(-4)});S.sheet=null;
  }
  else if(a==="cancel"){S.sheet={type:"cancel",id:id}}
  else if(a==="confirm"){S.subs.forEach(function(s){if(s.id===id)s.active=false});S.sheet=null}
  else if(a==="addsub"){S.sheet={type:"addsub"}}
  else if(a==="subadd"){
    var sn=el("s-name").value.trim(),sp=parseFloat(el("s-price").value),dv=el("s-date").value;
    if(!sn||!(sp>0)){err("errSub");return}
    S.subs.push({id:"u"+Date.now(),name:sn,p:sp,next:dv?new Date(dv+"T00:00:00"):new Date(2026,10,12),active:true});S.sheet=null;
  }
  else if(a==="tip"){S.sheet={type:"tip",id:id}}
  else if(a==="newfund"){S.sheet={type:"newfund"}}
  else if(a==="fundadd"){
    var fn=el("n-name").value.trim(),ft=parseFloat(el("n-target").value);
    if(!fn||!(ft>0)){err("errFund");return}
    S.goals.push({n:fn,s:0,t:ft});S.sheet=null;
  }
  else if(a==="addmoney"){S.sheet={type:"addmoney",i:+t.getAttribute("data-i")}}
  else if(a==="moneyadd"){
    var g=S.goals[+t.getAttribute("data-i")],am=parseFloat(el("m-amt").value);
    if(!(am>0)){err("errAmt");return}
    g.s=Math.min(g.t,g.s+am);S.sheet=null;
  }
  else if(a==="change"){S.sheet={type:"change",field:id,step:"input",val:null}}
  else if(a==="chnext"){
    var f=S.sheet.field,v;
    if(f==="photo"){v=S.sheet.val;if(!v){err("errPhoto");return}}
    else{v=el("c-val").value.trim();
      if(f==="name"&&!v){err("errName");return}
      if(f==="email"&&!/^\S+@\S+\.\S+$/.test(v)){err("errEmail");return}}
    S.sheet.val=v;S.sheet.step="verify";
  }
  else if(a==="chverify"){
    if(el("v-code").value.trim()!==DEMO_CODE){err("errCode");return}
    var fd=S.sheet.field;
    if(fd==="name")S.user.name=S.sheet.val;
    if(fd==="email")S.user.email=S.sheet.val;
    if(fd==="photo")S.user.photo=S.sheet.val;
    if(fd==="country")S.user.country=S.sheet.val;
    saveUser();S.sheet.step="done";
  }
  else if(a==="close"){S.sheet=null}
  else if(a==="logout"){S.mode="login";S.sheet=null;S.screen=null;S.tab="home"}
  render();
});
render();
})();
</script>
